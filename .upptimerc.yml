owner: headroomlabs-ai
repo: status

sites:
  - name: Customer dashboard (app.headroomlabs.ai)
    url: https://app.headroomlabs.ai
  - name: Website
    url: https://www.headroomlabs.ai
  - name: Documentation
    url: https://docs.headroomlabs.ai/docs
  # The ingest endpoint only accepts POST, so a GET answering 405 means the
  # Worker is up and routing requests.
  - name: Telemetry ingest
    url: https://headroom-beacon.headroom-beacon.workers.dev/v1/logs
    expectedStatusCodes:
      - 405

status-website:
  cname: status.headroomlabs.ai
  name: Headroom Labs Status
  logoUrl: https://status.headroomlabs.ai/headroom-full.png
  favicon: https://status.headroomlabs.ai/headroom-logo.png
  faviconSvg: https://status.headroomlabs.ai/headroom-favicon.svg
  themeUrl: https://status.headroomlabs.ai/headroom-theme.css
  links:
    - rel: preconnect
      href: https://fonts.googleapis.com
    - rel: stylesheet
      href: https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap
  introTitle: "Headroom Labs service status"
  introMessage: >
    Live status of the services Headroom Labs hosts: the customer dashboard,
    website, documentation and telemetry ingest. The Headroom proxy runs inside
    your own environment and keeps working during any outage shown here.
    Incidents and maintenance are posted on this page.
  navbar:
    - title: Status
      href: /
    - title: Website
      href: https://www.headroomlabs.ai
    - title: Support
      href: https://github.com/headroomlabs-ai/headroom/issues

assignees:
  - chopratejas

workflowSchedule:
  uptime: "*/5 * * * *"
